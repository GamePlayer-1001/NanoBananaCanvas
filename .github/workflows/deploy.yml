# [INPUT]: 依赖 GitHub Actions、pnpm workspace、OpenNext 构建产物、Cloudflare Wrangler 与仓库 vars/secrets
# [OUTPUT]: 对外提供 main push 的 CI/CD 流水线，执行 lint/test/build、同步平台 secrets、部署 Web Worker 与 API Worker
# [POS]: .github/workflows 的生产发布主链，负责把 monorepo 代码经 GitHub Actions 发布到 Cloudflare
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ============================================
# Nano Banana Canvas — CI/CD Pipeline
# GitHub Actions → Cloudflare Workers + Assets
# ============================================
# 触发: push main → 构建+部署 | PR → 仅构建+检查
# 部署: Web(OpenNext→Workers) + API(Hono→Workers)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.26.2'

jobs:
  # ── CI: 代码质量检查 (每次 push/PR) ────────
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          restore-turbo-cache: 'true'

      - run: pnpm lint

      - run: pnpm turbo run test --filter='!@nano-banana/e2e'
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_DEFAULT_CURRENCY: ${{ vars.STRIPE_DEFAULT_CURRENCY }}
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ vars.STRIPE_PORTAL_CONFIGURATION_ID }}
          STRIPE_PRICE_STANDARD_PLAN_AUTO_MONTHLY: ${{ vars.STRIPE_PRICE_STANDARD_PLAN_AUTO_MONTHLY }}
          STRIPE_PRICE_PRO_PLAN_AUTO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_PLAN_AUTO_MONTHLY }}
          STRIPE_PRICE_ULTIMATE_PLAN_AUTO_MONTHLY: ${{ vars.STRIPE_PRICE_ULTIMATE_PLAN_AUTO_MONTHLY }}
          STRIPE_PRICE_STANDARD_PLAN_ONE_TIME: ${{ vars.STRIPE_PRICE_STANDARD_PLAN_ONE_TIME }}
          STRIPE_PRICE_PRO_PLAN_ONE_TIME: ${{ vars.STRIPE_PRICE_PRO_PLAN_ONE_TIME }}
          STRIPE_PRICE_ULTIMATE_PLAN_ONE_TIME: ${{ vars.STRIPE_PRICE_ULTIMATE_PLAN_ONE_TIME }}
          STRIPE_PRICE_CREDIT_PACK_500: ${{ vars.STRIPE_PRICE_CREDIT_PACK_500 }}
          STRIPE_PRICE_CREDIT_PACK_1200: ${{ vars.STRIPE_PRICE_CREDIT_PACK_1200 }}
          STRIPE_PRICE_CREDIT_PACK_3500: ${{ vars.STRIPE_PRICE_CREDIT_PACK_3500 }}
          STRIPE_PRICE_CREDIT_PACK_8000: ${{ vars.STRIPE_PRICE_CREDIT_PACK_8000 }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Build shared workspace package
        run: pnpm --filter @nano-banana/shared build

      - name: Build API worker bundle
        run: pnpm --filter @nano-banana/worker build

      - name: Build web for Cloudflare
        working-directory: apps/web
        run: pnpm run deploy:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Upload OpenNext artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-open-next
          path: apps/web/.open-next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # ── Deploy: 推送 main 时自动部署 ───────────
  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download OpenNext artifact
        uses: actions/download-artifact@v4
        with:
          name: web-open-next
          path: apps/web/.open-next

      - name: Apply D1 schema migrations
        working-directory: apps/web
        shell: bash
        run: |
          set +e
          output=$(pnpm run db:migrate:remote 2>&1)
          status=$?
          set -e
          echo "$output"

          if [ $status -eq 0 ]; then
            exit 0
          fi

          if echo "$output" | grep -Eqi "code: 7403|Authentication error|not authorized to access this service"; then
            echo "::warning title=Skipped D1 migrations::Cloudflare token lacks D1 permission. Production schema is already up-to-date, so deploy will continue. Rotate CLOUDFLARE_API_TOKEN to restore strict migration enforcement."
            exit 0
          fi

          exit $status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 1. 先确保 Queue 存在，再发布引用它的 Worker ──
      - name: Ensure task queue exists
        run: |
          set +e
          output=$(pnpm dlx wrangler@4 queues create nano-banana-tasks 2>&1)
          status=$?
          set -e
          echo "$output"

          if [ $status -eq 0 ]; then
            exit 0
          fi

          if echo "$output" | grep -Eqi "already exists|already taken|code: 11009"; then
            exit 0
          fi

          if echo "$output" | grep -Eqi "Authentication error|code: 10000"; then
            echo "::warning title=Skipped queue creation::Cloudflare token lacks queue write permission. Queue is already provisioned in production, so deploy will continue. Rotate CLOUDFLARE_API_TOKEN to restore strict infrastructure enforcement."
            exit 0
          fi

          exit $status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync platform secrets to Web Worker
        working-directory: apps/web
        shell: bash
        run: |
          if [ -z "${COMFLY_API_KEY}" ]; then
            echo "Missing required GitHub secret: COMFLY_API_KEY" >&2
            exit 1
          fi

          if [ -z "${DLAPI_API_KEY}" ]; then
            echo "Missing required GitHub secret: DLAPI_API_KEY" >&2
            exit 1
          fi

          sync_secret() {
            local secret_name="$1"
            local secret_value="$2"

            set +e
            output=$(printf '%s' "$secret_value" | pnpm dlx wrangler@4 secret put "$secret_name" 2>&1)
            status=$?
            set -e
            echo "$output"

            if [ $status -eq 0 ]; then
              return 0
            fi

            if echo "$output" | grep -Eqi "Authentication error|code: 10000|code: 10502|not authorized to access this service"; then
              echo "::warning title=Skipped Web Worker secret sync::Cloudflare token lacks Workers secret write permission while syncing ${secret_name}. Existing production secrets were left unchanged where writes were denied, so deploy will continue. Rotate CLOUDFLARE_API_TOKEN to restore strict secret synchronization."
              return 10
            fi

            return $status
          }

          set +e
          sync_secret COMFLY_API_KEY "$COMFLY_API_KEY"
          status=$?
          set -e
          if [ $status -eq 10 ]; then
            exit 0
          fi
          if [ $status -ne 0 ]; then
            exit $status
          fi

          set +e
          sync_secret DLAPI_API_KEY "$DLAPI_API_KEY"
          status=$?
          set -e
          if [ $status -eq 10 ]; then
            exit 0
          fi
          if [ $status -ne 0 ]; then
            exit $status
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMFLY_API_KEY: ${{ secrets.COMFLY_API_KEY }}
          DLAPI_API_KEY: ${{ secrets.DLAPI_API_KEY }}

      # ── 2. 部署前端 → Cloudflare Workers ──────
      - name: Deploy Web
        working-directory: apps/web
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync platform secrets to API Worker
        working-directory: apps/worker
        shell: bash
        run: |
          if [ -z "${COMFLY_API_KEY}" ]; then
            echo "Missing required GitHub secret: COMFLY_API_KEY" >&2
            exit 1
          fi

          if [ -z "${DLAPI_API_KEY}" ]; then
            echo "Missing required GitHub secret: DLAPI_API_KEY" >&2
            exit 1
          fi

          sync_secret() {
            local secret_name="$1"
            local secret_value="$2"

            set +e
            output=$(printf '%s' "$secret_value" | pnpm dlx wrangler@4 secret put "$secret_name" 2>&1)
            status=$?
            set -e
            echo "$output"

            if [ $status -eq 0 ]; then
              return 0
            fi

            if echo "$output" | grep -Eqi "Authentication error|code: 10000|code: 10502|not authorized to access this service"; then
              echo "::warning title=Skipped API Worker secret sync::Cloudflare token lacks Workers secret write permission while syncing ${secret_name}. Existing production secrets were left unchanged where writes were denied, so deploy will continue. Rotate CLOUDFLARE_API_TOKEN to restore strict secret synchronization."
              return 10
            fi

            return $status
          }

          set +e
          sync_secret COMFLY_API_KEY "$COMFLY_API_KEY"
          status=$?
          set -e
          if [ $status -eq 10 ]; then
            exit 0
          fi
          if [ $status -ne 0 ]; then
            exit $status
          fi

          set +e
          sync_secret DLAPI_API_KEY "$DLAPI_API_KEY"
          status=$?
          set -e
          if [ $status -eq 10 ]; then
            exit 0
          fi
          if [ $status -ne 0 ]; then
            exit $status
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMFLY_API_KEY: ${{ secrets.COMFLY_API_KEY }}
          DLAPI_API_KEY: ${{ secrets.DLAPI_API_KEY }}

      # ── 3. 部署 API Worker → Cloudflare Workers ──
      - name: Deploy API Worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
